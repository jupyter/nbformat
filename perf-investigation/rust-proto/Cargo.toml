[package]
name = "nbf_rust"
version = "0.1.0"
edition = "2021"

[lib]
name = "nbf_rust"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.22", features = ["extension-module"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
jsonschema = { version = "0.18", default-features = false }
once_cell = "1"

[profile.release]
lto = true
codegen-units = 1
